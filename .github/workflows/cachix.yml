name: Build and push to Cachix

on:
  push:
    branches: [chimera-pkgs]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: chimera-pkgs
          # Repo secret, see https://app.cachix.org/cache/chimera-pkgs/auth
          # Empty on forks -> pull-only, push is skipped.
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build packages
        # cachix-action watches the store and pushes everything built here.
        run: |
          nix build \
            .#iosevka-chimera \
            .#netexec \
            .#sliver-client \
            .#sliver-server \
            --print-build-logs
