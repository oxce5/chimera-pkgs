name: Build and push to Cachix

on:
  push:
    branches: [chimera-pkgs]
  pull_request:
  workflow_dispatch:

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSU6h44bbx96VOlDHoayWR3I/7mD/

      - name: Check Cachix token
        # Fail loudly on push (instead of silently skipping the push)
        # when the CACHIX_AUTH_TOKEN secret is missing. PRs from forks
        # have no access to secrets and stay pull-only.
        if: github.event_name == 'push'
        run: |
          if [ -z "${{ secrets.CACHIX_AUTH_TOKEN }}" ]; then
            echo "::error::CACHIX_AUTH_TOKEN secret is not set - Cachix push will be skipped."
            exit 1
          fi

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: chimera-pkgs
          # Repo secret, see https://app.cachix.org/cache/chimera-pkgs/auth
          # Empty on forks -> pull-only, push is skipped.
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build packages
        # cachix-action watches the store and pushes everything built here.
        run: |
          nix build \
            .#evil-winrm \
            .#netexec \
            .#sliver-client \
            .#sliver-server \
            --print-build-logs

  font:
    # Separate job: iosevka-chimera needs nodejs at build time, and a fresh
    # nixpkgs can ship a nodejs too new for Hydra to have cached yet - then
    # the runner compiles V8 from source (~1900 objects, 1-2h). Isolated here
    # so a slow/failed font build never blocks the fast packages above.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSU6h44bbx96VOlDHoayWR3I/7mD/

      - name: Check Cachix token
        if: github.event_name == 'push'
        run: |
          if [ -z "${{ secrets.CACHIX_AUTH_TOKEN }}" ]; then
            echo "::error::CACHIX_AUTH_TOKEN secret is not set - Cachix push will be skipped."
            exit 1
          fi

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: chimera-pkgs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Refuse local nodejs build
        # iosevka needs nodejs at build time; a fresh nixpkgs can ship one
        # too new for Hydra to have cached. Fail fast instead of compiling
        # V8 from source for hours - re-run once the binary cache has it.
        run: |
          if nix build .#iosevka-chimera --dry-run 2>&1 \
            | awk '/will be built:/{f=1;next} /will be fetched/{f=0} f' \
            | grep -qi "nodejs"; then
            echo "::error::iosevka-chimera would build nodejs from source (missing from binary caches). Aborting to avoid a multi-hour V8 compile - re-run once Hydra has cached it."
            exit 1
          fi

      - name: Build font
        run: |
          nix build .#iosevka-chimera --print-build-logs
